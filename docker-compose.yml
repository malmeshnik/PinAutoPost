services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinterest_user} -d ${POSTGRES_DB:-pinterest_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-strong_redis_password}

  migrate:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000 --noreload
    volumes:
      - .:/app
    ports:
      - "80:8000"
      - "5678:5678"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

  worker:
    build: .
    command: python -m debugpy --listen 0.0.0.0:5679 -m celery -A pinterest_poster worker -l info
    ports:
      - "5679:5679"
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

  # Health checks run outside Celery so Redis/worker outages can be detected.
  monitor:
    build: .
    command: python manage.py monitor_system_health --interval 60
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  beat:
    build: .
    command: celery -A pinterest_poster beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-pinterest_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinterest_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinterest_pass}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

volumes:
  postgres_data:
